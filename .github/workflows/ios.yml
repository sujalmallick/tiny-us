name: Tiny Us iOS Build & IPA Package

on:
  workflow_dispatch:
  # Builds iOS work branches on every push, and any pull request that touches iOS or shared code.
  push:
    branches: [ 'ios/**' ]
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - 'app/src/main/res/raw/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/ios.yml'
      - '.github/scripts/report_build_errors.py'
  pull_request:
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - 'app/src/main/res/raw/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/ios.yml'
      - '.github/scripts/report_build_errors.py'

concurrency:
  group: ios-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    # An ios/** branch is already built by its push; skip the duplicate pull_request run.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'ios/')
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Configure Android SDK Location
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties

      - name: Show toolchain
        run: |
          mkdir -p build-logs
          sw_vers
          xcodebuild -version

      - name: Verify Privacy & Safeguards
        run: |
          set -o pipefail
          ./gradlew verifyNoUnauthorizedNetworkingOrAnalytics 2>&1 | tee build-logs/gradle-privacy.log

      - name: Run Shared iOS Unit Tests
        run: |
          set -o pipefail
          ./gradlew :shared:iosSimulatorArm64Test 2>&1 | tee build-logs/gradle-ios-tests.log

      - name: Precompile Shared iOS Frameworks
        run: |
          set -o pipefail
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 :shared:linkReleaseFrameworkIosArm64 2>&1 | tee build-logs/gradle-frameworks.log

      - name: Build iOS App (Simulator Debug)
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -configuration Debug \
                     -destination 'generic/platform=iOS Simulator' \
                     ARCHS=arm64 \
                     ONLY_ACTIVE_ARCH=YES \
                     JAVA_HOME="$JAVA_HOME" \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     build 2>&1 | tee build-logs/xcodebuild-debug.log

      - name: Archive iOS App for Device
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/iosApp.xcarchive \
                     ARCHS=arm64 \
                     ONLY_ACTIVE_ARCH=YES \
                     JAVA_HOME="$JAVA_HOME" \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO 2>&1 | tee build-logs/xcodebuild-archive.log

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/iosApp.xcarchive/Products/Applications/iosApp.app Payload/
          zip -r TinyUs-iOS-unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyUs-iOS-unsigned
          path: TinyUs-iOS-unsigned.ipa
          retention-days: 14

      # Job logs need a GitHub login, but annotations are public: surface compiler errors there.
      - name: Report build errors
        if: failure()
        run: python3 .github/scripts/report_build_errors.py build-logs

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 7
