name: Tiny Us iOS Build & IPA Package

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Configure Android SDK Location
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties

      - name: Verify Privacy & Safeguards
        run: ./gradlew verifyNoUnauthorizedNetworkingOrAnalytics

      - name: Run Shared iOS Unit Tests
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Precompile Shared iOS Frameworks
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 :shared:linkReleaseFrameworkIosArm64

      - name: Build iOS App (Simulator Debug)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -configuration Debug \
                     -destination 'generic/platform=iOS Simulator' \
                     ARCHS=arm64 \
                     ONLY_ACTIVE_ARCH=YES \
                     JAVA_HOME="$JAVA_HOME" \
                     build

      - name: Archive iOS App for Device
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/iosApp.xcarchive \
                     ARCHS=arm64 \
                     ONLY_ACTIVE_ARCH=YES \
                     JAVA_HOME="$JAVA_HOME" \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/iosApp.xcarchive/Products/Applications/iosApp.app Payload/
          zip -r TinyUs-iOS-unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyUs-iOS-unsigned
          path: TinyUs-iOS-unsigned.ipa
          retention-days: 14
