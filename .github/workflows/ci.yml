name: Tiny Us CI & Privacy Safeguard

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # v3 used GitHub's retired cache service (every restore failed with 400, so each run started
      # cold). The open-source "basic" provider caches Gradle's dependencies and build cache.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Run Privacy & Dependency Safeguard Check
        run: ./gradlew verifyNoUnauthorizedNetworkingOrAnalytics

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest

      - name: Run Shared (commonTest) Tests on the JVM
        run: ./gradlew :shared:testAndroidHostTest

      # Shared code must compile for every platform, not just the JVM: this catches JVM-only
      # calls (such as toSortedMap) in commonMain here, without waiting for the macOS iOS build.
      - name: Compile shared code for all platforms (commonMain metadata)
        run: ./gradlew :shared:compileCommonMainKotlinMetadata
